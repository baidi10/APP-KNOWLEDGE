[pytest]
# ---------------------------------------------------------------------------
# Pytest configuration for AdoptAI App Knowledge Base – backend
# ---------------------------------------------------------------------------

# Test discovery: look for tests/ directories and files matching test_*.py
testpaths = tests

# Show each test name as it runs (not just a dot) for cleaner CI output
addopts =
    -v
    --tb=short
    --strict-markers

# Registered custom markers (avoids PytestUnknownMarkWarning)
markers =
    unit: Pure unit tests with no database or HTTP calls
    integration: Tests that use the in-memory test database and TestClient
